[project]
name = "langchain-first"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "minuuoo", email = "minu0922@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "arxiv>=4.0.2",
    "datasets>=5.1.0",
    "deepagents>=0.7.29",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "streamlit[pdf]>=1.66.1",
]

[project.scripts]
langchain-first = "langchain_first:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# 기존 예제 폴더의 스크립트형 test_*.py는 수집하지 않음
testpaths = ["tests"]
pythonpath = ["."]
