[project]
name = "langchain-first"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "minuuoo", email = "minu0922@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.29",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
langchain-first = "langchain_first:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
